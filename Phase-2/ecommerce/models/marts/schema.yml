version: 2

models:
  - name: fact_orders
    columns:
      - name: order_item_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'processing', 'unavailable', 'invoiced', 'created', 'approved']
  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null